<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HandInvert — Hand Controlled Color Inversion</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#f4f6ff;font:15px system-ui,sans-serif}
header{padding:12px 14px;background:#121725;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
h1{font-size:19px;margin:0}
button{border:0;border-radius:9px;padding:10px 14px;background:#6657e8;color:#fff;font-weight:700}
button.secondary{background:#30394e}
#status{width:100%;font-size:13px;color:#c1cbe0}
#stage{position:relative;width:100vw;height:calc(100dvh - 100px);min-height:280px;overflow:hidden;background:#000}
.cam{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;transform:scaleX(-1)}
#normal{z-index:1}
#inverted{z-index:2;filter:invert(1);clip-path:polygon(0 0,0 0,0 0,0 0);display:none}
#overlay{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.hint{position:absolute;z-index:4;bottom:10px;left:10px;right:10px;text-align:center;color:white;text-shadow:0 1px 5px #000;font-size:13px;pointer-events:none}
footer{padding:8px 12px;color:#9eabc6;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🖐️ HandInvert</h1>
<button id="start">Start camera</button>
<button id="stop" class="secondary">Stop</button>
<div id="status">Press Start camera and allow camera access.</div>
</header>
<div id="stage">
<video id="normal" class="cam" autoplay playsinline muted></video>
<video id="inverted" class="cam" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div class="hint" id="hint">Show both hands. The area between your thumb and index fingertips becomes color-inverted.</div>
</div>
<footer>HandInvert • Live camera effect • Internet required for the hand-tracking model</footer>
<script type="module">
import {FilesetResolver,HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const normal=document.getElementById("normal");
const inverted=document.getElementById("inverted");
const canvas=document.getElementById("overlay");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const hint=document.getElementById("hint");
let stream=null,tracker=null,running=false,lastTime=-1;

function orderCorners(points){
  const cx=points.reduce((s,p)=>s+p.x,0)/4,cy=points.reduce((s,p)=>s+p.y,0)/4;
  const sorted=[...points].sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx));
  let start=0,best=Infinity;
  sorted.forEach((p,i)=>{const v=p.x+p.y;if(v<best){best=v;start=i;}});
  const q=sorted.slice(start).concat(sorted.slice(0,start));
  const area=q.reduce((s,p,i)=>s+p.x*q[(i+1)%4].y-q[(i+1)%4].x*p.y,0);
  return area<0?[q[0],q[3],q[2],q[1]]:q;
}
async function loadTracker(){
 if(tracker)return;
 status.textContent="Loading hand tracking model…";
 const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 tracker=await HandLandmarker.createFromOptions(vision,{
  baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
  runningMode:"VIDEO",numHands:2
 });
}
document.getElementById("start").onclick=async()=>{
 try{
  await loadTracker();
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}}});
  normal.srcObject=stream;inverted.srcObject=stream;
  await Promise.all([normal.play(),inverted.play()]);
  running=true;status.textContent="Camera active — show both hands.";requestAnimationFrame(loop);
 }catch(e){status.textContent="Could not start camera: "+e.message+" — allow camera access and use HTTPS.";}
};
document.getElementById("stop").onclick=()=>{
 running=false;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;normal.srcObject=null;inverted.srcObject=null;
 inverted.style.display="none";status.textContent="Camera stopped.";
 ctx.clearRect(0,0,canvas.width,canvas.height);
};
function loop(){
 if(!running)return;
 if(normal.readyState>=2&&normal.currentTime!==lastTime){
  lastTime=normal.currentTime;
  const w=normal.clientWidth,h=normal.clientHeight;
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  const result=tracker.detectForVideo(normal,performance.now());
  ctx.clearRect(0,0,w,h);
  if(result.landmarks&&result.landmarks.length>=2){
   const pts=[];
   for(let i=0;i<2;i++){
    const hand=result.landmarks[i];
    for(const idx of [4,8])pts.push({x:(1-hand[idx].x)*w,y:hand[idx].y*h});
   }
   const corners=orderCorners(pts);
   const poly=corners.map(p=>`${(p.x/w*100).toFixed(2)}% ${(p.y/h*100).toFixed(2)}%`).join(",");
   inverted.style.clipPath=`polygon(${poly})`;
   inverted.style.display="block";
   ctx.beginPath();corners.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
   ctx.strokeStyle="#7ffcff";ctx.lineWidth=3;ctx.stroke();
   ctx.fillStyle="#ffdf68";
   corners.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();});
   hint.textContent="Color inversion active inside your hand frame ✓";
   status.textContent="Both hands detected — move them to move the inverted area.";
  }else{
   inverted.style.display="none";
   hint.textContent="Show BOTH hands to create the color-inverted area.";
   status.textContent="Waiting for two hands…";
  }
  if(result.landmarks)result.landmarks.forEach(hand=>[4,8].forEach(idx=>{
   const p=hand[idx],x=(1-p.x)*w,y=p.y*h;
   ctx.fillStyle="#ffdf68";ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();
  }));
 }
 requestAnimationFrame(loop);
}
</script>
</body>
</html>
